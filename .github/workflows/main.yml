
name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-tests:
    name: Analyze and Test Flutter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Flutter Code
        run: flutter analyze

      - name: Run Automated Tests
        run: flutter test

      - name: Install Example Dependencies
        working-directory: example
        run: flutter pub get

      - name: Analyze Example Application
        working-directory: example
        run: flutter analyze
